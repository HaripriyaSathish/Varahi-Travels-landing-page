{% load static %}
<section class="destinations-section" id="destinations">
  <div class="container">

    <div class="section-heading reveal">
      <span class="section-eyebrow">{{ destinations_section.eyebrow }}</span>
      <h2 class="section-title">{{ destinations_section.heading }}</h2>
      {% if destinations_section.subtitle %}
        <p class="section-subtitle">{{ destinations_section.subtitle }}</p>
      {% endif %}
    </div>

    <div class="destinations-grid">
      {% for destination in destinations %}
        <div class="destination-card reveal">
          {% if destination.image %}
            <img src="{{ destination.image.url }}" alt="{{ destination.name }}">
          {% endif %}
          <div class="destination-overlay"></div>
          <span class="destination-name">{{ destination.name }}</span>
          <a class="destination-arrow"
             href="https://wa.me/{{ site.whatsapp_number }}?text=Hi%2C%20I%27m%20interested%20in%20a%20trip%20to%20{{ destination.name|urlencode }}.%20Please%20share%20package%20options."
             target="_blank" rel="noopener" aria-label="Enquire about {{ destination.name }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 17L17 7M17 7H7M17 7V17"/>
            </svg>
          </a>
        </div>
      {% endfor %}
    </div>

  </div>
</section>
