{% load static %}
<header class="site-header" id="siteHeader">
  <div class="container nav-wrap">

    <a href="#home" class="brand">
      {% if site.logo %}
        <img src="{{ site.logo.url }}" alt="{{ site.site_name }}" class="brand-logo">
      {% endif %}
      <span class="brand-text">
        <strong>{{ site.site_name }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="#home">Home</a>
      <a href="#fleet">Fleet</a>
      <a href="#packages">Packages</a>
      <a href="#services">Services</a>
      <a href="#destinations">Destinations</a>
      <a href="#about">About</a>
      <a href="#reviews">Reviews</a>
      <a href="#gallery">Gallery</a>
      <a href="#faq">FAQ</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="nav-actions">
      <a href="tel:{{ site.phone }}" class="btn btn-outline btn-sm">
        <svg class="icon-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Call Now
      </a>
      <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener" class="btn btn-whatsapp btn-sm">
        <svg class="icon-svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.38a9.9 9.9 0 0 0 4.76 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.13-2.9-7C17.18 3.03 14.7 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.93 1.38-.49.08-1.11.11-1.79-.11-.41-.13-.94-.31-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.93 0-1.4.73-2.08 1-2.36.26-.28.56-.35.75-.35h.53c.17 0 .4-.06.62.48.24.58.8 2 .87 2.14.07.15.12.32.02.51-.1.19-.15.31-.3.48-.15.17-.31.38-.45.51-.15.14-.3.3-.13.6.17.29.75 1.24 1.62 2 1.11.99 2.05 1.3 2.34 1.44.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.63-.15.26.1 1.66.79 1.94.93.29.15.48.22.55.34.07.13.07.72-.17 1.4z"/>
        </svg>
        WhatsApp
      </a>

      <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile slide-down menu -->
  <div class="mobile-nav" id="mobileNav">
    <a href="#home">Home</a>
    <a href="#fleet">Fleet</a>
    <a href="#packages">Packages</a>
    <a href="#services">Services</a>
    <a href="#destinations">Destinations</a>
    <a href="#about">About</a>
    <a href="#reviews">Reviews</a>
    <a href="#gallery">Gallery</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">Contact</a>
    <a href="tel:{{ site.phone }}" class="btn btn-outline btn-block">Call Now</a>
    <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener" class="btn btn-whatsapp btn-block">WhatsApp</a>
  </div>
</header>

<script>
  (function () {
    const toggle = document.getElementById('navToggle');
    const mobileNav = document.getElementById('mobileNav');
    toggle.addEventListener('click', function () {
      const isOpen = mobileNav.classList.toggle('open');
      toggle.classList.toggle('active', isOpen);
      toggle.setAttribute('aria-expanded', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    mobileNav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        mobileNav.classList.remove('open');
        toggle.classList.remove('active');
        document.body.style.overflow = '';
      });
    });

    // Transparent over the hero at the top; solid white once scrolled.
    const header = document.getElementById('siteHeader');
    function updateHeaderOnScroll() {
      header.classList.toggle('scrolled', window.scrollY > 5);
    }
    window.addEventListener('scroll', updateHeaderOnScroll);
    updateHeaderOnScroll();
  })();
</script>
