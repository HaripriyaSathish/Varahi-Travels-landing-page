{% load static %}
<section class="cta-section">
  {% if cta.background_image %}
    <div class="cta-bg" style="background-image:url('{{ cta.background_image.url }}');"></div>
  {% endif %}
  <div class="cta-overlay"></div>

  <div class="container cta-content reveal">
    <span class="section-eyebrow">{{ cta.eyebrow }}</span>
    <h2 class="cta-heading">{{ cta.heading }}</h2>
    {% if cta.subtitle %}<p class="cta-subtitle">{{ cta.subtitle }}</p>{% endif %}

    <div class="cta-buttons">
      <a href="tel:{{ site.phone }}" class="btn btn-primary cta-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        {{ cta.button1_text }}
      </a>
      <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener" class="btn btn-secondary cta-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        {{ cta.button2_text }}
      </a>
    </div>
  </div>
</section>
