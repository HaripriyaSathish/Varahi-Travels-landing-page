{% load static %}
<section class="gallery-section" id="gallery">
  <div class="container">

    <div class="section-heading reveal">
      <span class="section-eyebrow">{{ gallery_section.eyebrow }}</span>
      <h2 class="section-title">{{ gallery_section.heading }}</h2>
      {% if gallery_section.subtitle %}
        <p class="section-subtitle">{{ gallery_section.subtitle }}</p>
      {% endif %}
    </div>

    <div class="gallery-grid">
      {% for photo in gallery_images %}
        <div class="gallery-item reveal">
          {% if photo.image %}<img src="{{ photo.image.url }}" alt="{{ photo.caption }}">{% endif %}
          <div class="gallery-overlay"></div>
          <span class="gallery-caption">{{ photo.caption }}</span>
        </div>
      {% endfor %}
    </div>

  </div>
</section>
